<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nxrafa hub — Web Port</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #08080a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f4f4f6; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #08080a; z-index: 9999; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(139, 92, 246, 0.2); border-top-color: #a78bfa; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size: 14px; font-weight: 600; color: #f4f4f6;">Carregando Web Port Nativo...</div>
    <div style="font-size: 12px; color: #a1a1aa; font-family: monospace; margin-top: 4px;">Executando sem intermediários ou anúncios</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("url");

    async function start() {
      if (!targetUrl) {
        document.getElementById("loader").innerHTML = "<div style='color:#ef4444;'>URL do jogo não fornecida.</div>";
        return;
      }

      try {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error("HTTP " + res.status);
        let html = await res.text();

        const baseHref = targetUrl.substring(0, targetUrl.lastIndexOf("/") + 1);
        if (!html.includes("<base ")) {
          html = html.replace(/<head[^>]*>/i, "<head><base href=\"" + baseHref + "\">");
        }

        html = html.replace(/<script[^>]*accuracyinstalled[^>]*>[\s\S]*?<\/script>/gi, "");
        html = html.replace(/<script[^>]*rev\.iq[^>]*>[\s\S]*?<\/script>/gi, "");

        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.getElementById("loader").innerHTML = "<div style='color:#ef4444;font-weight:600;'>Falha ao carregar o jogo: " + err.message + "</div>";
      }
    }
    start();
  </script>
</body>
</html>
