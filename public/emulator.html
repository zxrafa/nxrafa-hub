<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nxrafa hub — Emulador Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #08080a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f4f6;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    .status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08080a;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .msg-sub { font-size: 13px; color: #a1a1aa; font-family: monospace; }
  </style>
</head>
<body>
  <div id="loader" class="status-overlay">
    <div class="spinner"></div>
    <div class="msg-title">Iniciando Emulador WebAssembly...</div>
    <div class="msg-sub">Carregando núcleo e baixando dados da ROM</div>
  </div>

  <div id="game-container"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const core = params.get("core") || "gba";
    let rawUrl = params.get("gameUrl") || "";
    const isBlob = rawUrl.startsWith("blob:") || rawUrl.startsWith("data:");
    const isLocal = rawUrl.startsWith("/") || rawUrl.startsWith("./") || rawUrl.startsWith("roms/");
    const isProxy = rawUrl.startsWith("/api/proxy");

    let resolvedUrl = rawUrl;
    if (!isBlob && !isLocal && !isProxy) {
      resolvedUrl = `/api/proxy?url=${encodeURIComponent(rawUrl)}`;
    }

    window.EJS_player = "#game-container";
    window.EJS_core = core;
    window.EJS_gameUrl = resolvedUrl;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = true;

    const hideLoader = () => {
      const loader = document.getElementById("loader");
      if (loader && loader.style.display !== "none") {
        loader.style.opacity = "0";
        setTimeout(() => { loader.style.display = "none"; }, 200);
      }
    };

    window.EJS_onGameStart = hideLoader;
    const readyWatcher = setInterval(() => {
      if (document.querySelector("#game-container canvas") || document.querySelector(".ejs_game")) {
        hideLoader();
        clearInterval(readyWatcher);
      }
    }, 150);

    const script = document.createElement("script");
    script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    script.onerror = () => {
      clearInterval(readyWatcher);
      const loader = document.getElementById("loader");
      if (loader) {
        loader.style.opacity = "1";
        loader.innerHTML = `
          <div style="font-size: 18px; font-weight: 700; color: #ef4444; margin-bottom: 8px;">Falha ao carregar núcleo</div>
          <p style="font-size: 13px; color: #a1a1aa; margin-bottom: 14px;">Não foi possível carregar os arquivos WebAssembly.</p>
          <button style="padding: 8px 16px; background: #8b5cf6; color: #fff; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer;" onclick="window.location.reload()">Tentar Novamente</button>
        `;
      }
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
